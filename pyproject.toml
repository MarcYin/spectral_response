[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RSRF"
version = "0.1.0"
description = "Canonical spectral response definitions, ingest tooling, and QA workflows for optical satellite sensors."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "LicenseRef-RepositorySpecific"
keywords = [
  "spectral response",
  "remote sensing",
  "satellite",
  "hyperspectral",
  "multispectral",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.21",
  "openpyxl>=3.1",
  "pandas>=1.5",
  "pyarrow>=10",
]

[project.urls]
Homepage = "https://github.com/MarcYin/spectral_response"
Documentation = "https://marcyin.github.io/spectral_response/"
Repository = "https://github.com/MarcYin/spectral_response"
Issues = "https://github.com/MarcYin/spectral_response/issues"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
ingest = [
  "h5py>=3.8",
  "netCDF4>=1.6",
  "xarray>=2023.0",
]
qa = [
  "matplotlib>=3.5",
]
release = [
  "build>=1.2",
  "twine>=5.1",
]
dev = [
  "h5py>=3.8",
  "matplotlib>=3.5",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "netCDF4>=1.6",
  "build>=1.2",
  "twine>=5.1",
  "xarray>=2023.0",
]

[project.scripts]
rsrf = "rsrf.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
