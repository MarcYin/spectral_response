[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-response-function"
version = "0.1.0"
description = "Canonical spectral response definitions and ingest tooling for satellite sensors."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.5",
  "netCDF4>=1.6",
  "pandas>=1.5",
  "pyarrow>=10",
  "pydantic>=2.0",
  "pytest>=7.0",
  "typer>=0.9",
  "xarray>=2023.0",
]

[project.scripts]
rsrf = "rsrf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
