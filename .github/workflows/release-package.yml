name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[release]
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Build runtime root bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dist/runtime-root
          mkdir -p dist/runtime-root/sources
          cp pyproject.toml dist/runtime-root/
          cp README.md dist/runtime-root/
          cp -R data dist/runtime-root/
          cp -R sources/manifests dist/runtime-root/sources/
          if [ -d sources/extracted ]; then
            cp -R sources/extracted dist/runtime-root/sources/
          fi
          find dist/runtime-root -name '.DS_Store' -delete
          tar -C dist/runtime-root -czf "dist/rsrf-root-v${VERSION}.tar.gz" .

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rsrf-root-v*.tar.gz
          generate_release_notes: true
